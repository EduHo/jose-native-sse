name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm test
      - run: npm run typecheck

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC credential npm authenticates with

    steps:
      - uses: actions/checkout@v4

      # No `registry-url` on purpose. It makes setup-node write an .npmrc
      # containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and
      # with no such variable that resolves to an empty token — npm then
      # considers itself unauthenticated and fails with ENEEDAUTH before OIDC is
      # ever attempted. The registry comes from publishConfig in package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 bundles npm 10; OIDC trusted publishing landed in npm 11.5.1.
      # Pinned to the 11 line rather than @latest: @latest is now 12.x, and a
      # major bump in the publish path is a variable this workflow does not need.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - run: npm install
      - run: npm run prepare   # builds lib/ and plugin/build/

      # No NODE_AUTH_TOKEN: the registry trusts this workflow directly, through
      # the OIDC token minted by `id-token: write` above. Nothing long-lived to
      # leak, expire, or rotate — and it sidesteps the account's 2FA-on-write
      # policy, which is what blocked the token-based attempts.
      # The preconditions are printed in this step rather than a separate one, so
      # that a pasted failure always carries them. Three earlier failures each
      # reported something other than their cause.
      - name: Publish
        run: |
          echo "── preconditions ─────────────────────────────────────────"
          echo "npm              $(npm -v)   (OIDC needs >= 11.5.1)"
          echo "registry         $(npm config get registry)"
          echo "OIDC request URL ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}${ACTIONS_ID_TOKEN_REQUEST_URL:-MISSING — is id-token: write set?}"
          echo "repository       ${GITHUB_REPOSITORY}"
          echo "workflow file    ${GITHUB_WORKFLOW_REF##*/.github/workflows/}"
          echo "ref              ${GITHUB_REF}"
          for f in "$HOME/.npmrc" "$GITHUB_WORKSPACE/.npmrc" .npmrc; do
            [ -f "$f" ] && { echo "npmrc $f:"; sed 's/=.*/=<redacted>/' "$f"; }
          done
          echo "──────────────────────────────────────────────────────────"
          npm publish --provenance --access public
