name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm test
      - run: npm run typecheck

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC credential npm authenticates with

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Node 22 bundles npm 10, which predates OIDC trusted publishing.
      # Without this the publish falls back to token auth, finds no token, and
      # fails with a 404 that does not mention the npm version at all.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - run: npm install
      - run: npm run prepare   # builds lib/ and plugin/build/

      # No NODE_AUTH_TOKEN: the registry trusts this workflow directly, through
      # the OIDC token minted by `id-token: write` above. Nothing long-lived to
      # leak, expire, or rotate — and it sidesteps the account's 2FA-on-write
      # policy, which is what blocked the token-based attempts.
      - name: Publish
        run: npm publish --provenance --access public
