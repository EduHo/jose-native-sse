buildscript {
  ext.getExtOrDefault = { name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["NativeSse_" + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
// React Native's Gradle plugin drives codegen for the TurboModule spec. Since
// RN 0.82 the New Architecture is the only architecture, so this is applied
// unconditionally — there is no legacy bridge path left to branch on.
apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["NativeSse_" + name]).toInteger()
}

android {
  compileSdk getExtOrIntegerDefault("compileSdkVersion")
  namespace "com.nativesse"

  defaultConfig {
    minSdk getExtOrIntegerDefault("minSdkVersion")
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  testOptions {
    unitTests.all {
      testLogging { showStandardStreams = true }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

// `kotlinOptions` is deprecated since Kotlin 2.0; this is the supported form.
kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // Resolved to the app's React Native version by the RN Gradle plugin.
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${getExtOrDefault('kotlinVersion')}"

  // OkHttp – Gradle resolves to the highest version on the classpath, so this
  // aligns with whatever React Native / Expo bring in.
  implementation "com.squareup.okhttp3:okhttp:4.12.0"

  // JVM stress/regression tests for the transport layer (see stress/README.md).
  testImplementation "junit:junit:4.13.2"
  testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
  testImplementation "org.jetbrains.kotlin:kotlin-test-junit:${getExtOrDefault('kotlinVersion')}"
}
